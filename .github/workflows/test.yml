name: Test

on:
    push:
        branches: [paprika]
    pull_request:
    workflow_dispatch:

concurrency:
    group: test-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            # No dependency install scripts, as on the server.
            - run: npm ci --ignore-scripts --no-audit --no-fund
            - run: npm run check
            - run: npm run lint
            - run: npm test
